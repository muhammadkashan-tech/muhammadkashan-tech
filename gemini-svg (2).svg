<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C19" />
      <stop offset="100%" stop-color="#03050B" />
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes moveStream {
        0% { transform: translateX(-150px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(200px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      .traveling-line {
        animation: moveStream 3s linear infinite;
      }
      .pulsing-ring {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)" />
    
    <!-- moving data streak lines -->
    <g stroke="#1c2550" stroke-width="1.4">
      <line x1="0" y1="60" x2="1200" y2="60" opacity="0.4" />
      <line x1="0" y1="150" x2="1200" y2="150" opacity="0.2" />
      <line x1="0" y1="240" x2="1200" y2="240" opacity="0.4" />
    </g>

    <!-- traveling light streaks (Live animated) -->
    <g class="traveling-line" stroke="#00AFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="100" y1="60" x2="250" y2="60" />
    </g>
    <g class="traveling-line" style="animation-delay: 1.5s;" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="600" y1="240" x2="800" y2="240" />
    </g>

    <!-- crosshair reticle (Live pulsing) -->
    <g class="pulsing-ring" transform="translate(950,150)" stroke="#2a3568" stroke-width="1.5" fill="none">
      <circle r="90" stroke-dasharray="4 6" />
      <circle r="120" opacity="0.5" />
      <line x1="-135" y1="0" x2="-105" y2="0" />
      <line x1="105" y1="0" x2="135" y2="0" />
      <line x1="0" y1="-135" x2="0" y2="-105" />
      <line x1="0" y1="105" x2="0" y2="135" />
    </g>

    <!-- web code brackets icon -->
    <g transform="translate(950,150)" fill="none" stroke="#8fd8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSoft)">
      <path d="M -25 -15 L -40 0 L -25 15" />
      <path d="M 25 -15 L 40 0 L 25 15" />
      <line x1="-8" y1="20" x2="8" y2="-20" />
    </g>

    <!-- connecting stream line -->
    <g transform="translate(950,150)">
      <path d="M -60 20 Q -90 40 -130 10" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="5 5" filter="url(#glowSoft)" />
    </g>

    <!-- Title text -->
    <g filter="url(#glowStrong)">
      <text x="72" y="115" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">MUHAMMAD KASHAN</text>
    </g>
    
    <text x="72" y="165" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-size="20" font-weight="700" fill="#00F2FE" letter-spacing="2">MODERN WEB & APP DEVELOPER</text>
    
    <text x="72" y="200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-size="14" fill="#8f86b8" letter-spacing="0.5">Building Responsive Web Apps . React . Node.js . Full-Stack</text>
    
    <!-- thin accent underline -->
    <rect x="72" y="215" width="260" height="3" fill="url(#textGlow)" opacity="0.9" rx="1.5" />
  </g>
  
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#1c2550" stroke-width="1" />
</svg>